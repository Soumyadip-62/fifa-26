services:
  - type: web
    name: fifa26-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile=false --prod=false && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    buildFilter:
      paths:
        - apps/api/**
        - packages/football-contracts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: PORT
        value: 10000

      - key: DATABASE_URL
        sync: false

      - key: FOOTBALL_DATA_API_KEY
        sync: false

      - key: FOOTBALL_DATA_REQUESTS_PER_MINUTE
        value: 8

      - key: FRONTEND_URL
        sync: false

      - key: FOOTBALL_SCHEDULER
        value: process

      - key: FOOTBALL_SCHEDULER_SECRET
        sync: false

      - key: FOOTBALL_PUSH_ENABLED
        value: false

      - key: ADMIN_SECRET
        sync: false

      - key: NEWS_API_URL
        value: "https://api.currentsapi.services/v1/"

      - key: NEWS_API_TOKEN
        sync: false

      - key: SPORTSMONK_API_URL
        value: "https://api.sportmonks.com/v3/football/"

      - key: SPORTSMONK_API_TOKEN
        sync: false

      - key: THESPORTSDB_API_URL
        value: "https://www.thesportsdb.com/api/v1/json/123/"
